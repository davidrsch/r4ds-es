name: Quarto Publish

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # This workflow installs dependencies from DESCRIPTION rather than
      # restoring renv.lock. Prevent .Rprofile from activating renv in CI.
      - name: Disable renv for this workflow
        run: |
          if [ -f .Rprofile ]; then
            mv .Rprofile .Rprofile.ci-disabled
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libudunits2-dev

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}